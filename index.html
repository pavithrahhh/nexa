<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d0d0d;
    --cream: #f5f0e8;
    --warm: #e8dcc8;
    --gold: #c9a84c;
    --rust: #c45c3a;
    --sage: #6b8c6e;
    --mist: #b8c4c2;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated background */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.18;
    animation: float 12s ease-in-out infinite;
  }

  .orb-1 {
    width: 500px; height: 500px;
    background: var(--gold);
    top: -150px; left: -100px;
    animation-delay: 0s;
  }

  .orb-2 {
    width: 400px; height: 400px;
    background: var(--rust);
    bottom: -100px; right: -80px;
    animation-delay: -4s;
  }

  .orb-3 {
    width: 300px; height: 300px;
    background: var(--sage);
    top: 50%; left: 60%;
    animation-delay: -8s;
  }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -40px) scale(1.05); }
    66% { transform: translate(-20px, 20px) scale(0.95); }
  }

  /* Grid lines */
  .grid {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(245,240,232,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(245,240,232,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 0;
  }

  /* Card */
  .card-wrap {
    position: relative;
    z-index: 10;
    perspective: 1200px;
    animation: cardIn 1s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(60px) rotateX(6deg); }
    to   { opacity: 1; transform: translateY(0) rotateX(0); }
  }

  .card {
    background: rgba(245,240,232,0.04);
    border: 1px solid rgba(245,240,232,0.1);
    backdrop-filter: blur(24px);
    border-radius: 2px;
    width: 420px;
    padding: 56px 48px 52px;
    position: relative;
    overflow: hidden;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(201,168,76,0.15);
  }

  /* Corner decoration */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 80px; height: 80px;
    border-top: 1px solid var(--gold);
    border-left: 1px solid var(--gold);
    opacity: 0.5;
    transition: width 0.5s ease, height 0.5s ease, opacity 0.3s ease;
  }
  .card::after {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 80px; height: 80px;
    border-bottom: 1px solid var(--gold);
    border-right: 1px solid var(--gold);
    opacity: 0.5;
    transition: width 0.5s ease, height 0.5s ease, opacity 0.3s ease;
  }
  .card:hover::before, .card:hover::after {
    width: 120px; height: 120px;
    opacity: 0.9;
  }

  /* Logo mark */
  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 40px;
    animation: fadeUp 0.8s 0.2s cubic-bezier(0.16,1,0.3,1) both;
  }

  .logo-icon {
    width: 36px; height: 36px;
    position: relative;
  }

  .logo-icon svg {
    width: 100%; height: 100%;
  }

  .logo-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--cream);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Heading */
  .heading {
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px;
    font-weight: 300;
    color: var(--cream);
    line-height: 1.1;
    margin-bottom: 8px;
    animation: fadeUp 0.8s 0.3s cubic-bezier(0.16,1,0.3,1) both;
  }

  .heading span {
    color: var(--gold);
    font-style: italic;
  }

  .subtext {
    font-size: 11px;
    color: var(--mist);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 40px;
    animation: fadeUp 0.8s 0.4s cubic-bezier(0.16,1,0.3,1) both;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(245,240,232,0.15), transparent);
    margin-bottom: 36px;
    animation: expandWidth 0.8s 0.5s ease both;
  }

  @keyframes expandWidth {
    from { transform: scaleX(0); opacity: 0; }
    to   { transform: scaleX(1); opacity: 1; }
  }

  /* Fields */
  .field {
    margin-bottom: 24px;
    animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) both;
  }

  .field:nth-child(1) { animation-delay: 0.5s; }
  .field:nth-child(2) { animation-delay: 0.6s; }

  label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--mist);
    margin-bottom: 10px;
  }

  .input-wrap {
    position: relative;
  }

  input {
    width: 100%;
    background: rgba(245,240,232,0.05);
    border: 1px solid rgba(245,240,232,0.12);
    border-radius: 1px;
    padding: 14px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--cream);
    outline: none;
    transition: border-color 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    letter-spacing: 0.04em;
  }

  input::placeholder { color: rgba(184,196,194,0.4); }

  input:focus {
    border-color: var(--gold);
    background: rgba(201,168,76,0.06);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.08), inset 0 0 20px rgba(201,168,76,0.04);
  }

  /* Animated underline on focus */
  .input-line {
    position: absolute;
    bottom: 0; left: 50%;
    width: 0; height: 1px;
    background: var(--gold);
    transition: width 0.4s ease, left 0.4s ease;
    transform: translateX(-50%);
  }

  input:focus ~ .input-line {
    width: 100%;
  }

  /* Options row */
  .options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    animation: fadeUp 0.8s 0.7s cubic-bezier(0.16,1,0.3,1) both;
  }

  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .remember input[type=checkbox] {
    width: 14px; height: 14px;
    padding: 0;
    accent-color: var(--gold);
    cursor: pointer;
  }

  .remember span {
    font-size: 11px;
    color: var(--mist);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .forgot {
    font-size: 11px;
    color: var(--gold);
    text-decoration: none;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.7;
    transition: opacity 0.2s;
  }

  .forgot:hover { opacity: 1; }

  /* Button */
  .btn {
    width: 100%;
    padding: 16px;
    background: var(--gold);
    border: none;
    border-radius: 1px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
    font-weight: 400;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
    animation: fadeUp 0.8s 0.8s cubic-bezier(0.16,1,0.3,1) both;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.5s ease, height 0.5s ease, opacity 0.5s ease;
    opacity: 0;
  }

  .btn:hover {
    background: #d4b05a;
    box-shadow: 0 8px 32px rgba(201,168,76,0.35);
    transform: translateY(-1px);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn:active::before {
    width: 300px; height: 300px;
    opacity: 0;
    transition: 0s;
  }

  .btn-text { position: relative; z-index: 1; }

  /* Divider or */
  .or-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 28px 0;
    animation: fadeUp 0.8s 0.9s cubic-bezier(0.16,1,0.3,1) both;
  }

  .or-line { flex: 1; height: 1px; background: rgba(245,240,232,0.1); }

  .or-text {
    font-size: 10px;
    color: var(--mist);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.6;
  }

  /* Social buttons */
  .socials {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    animation: fadeUp 0.8s 1s cubic-bezier(0.16,1,0.3,1) both;
  }

  .social-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px;
    background: rgba(245,240,232,0.04);
    border: 1px solid rgba(245,240,232,0.1);
    border-radius: 1px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--mist);
    transition: border-color 0.3s ease, background 0.3s ease, color 0.3s ease, transform 0.2s ease;
  }

  .social-btn:hover {
    border-color: rgba(245,240,232,0.25);
    background: rgba(245,240,232,0.08);
    color: var(--cream);
    transform: translateY(-2px);
  }

  .social-btn svg { flex-shrink: 0; }

  /* Footer */
  .footer {
    margin-top: 36px;
    text-align: center;
    font-size: 11px;uuuuuu
    color: var(--mist);
    letter-spacing: 0.08em;
    animation: fadeUp 0.8s 1.1s cubic-bezier(0.16,1,0.3,1) both;
    opacity: 0.6;
  }

  .footer a { color: var(--gold); text-decoration: none; }
  .footer a:hover { opacity: 0.8; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Floating particles */
  .particle {
    position: fixed;
    width: 2px; height: 2px;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0;
    animation: particleFloat linear infinite;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes particleFloat {
    0%   { opacity: 0; transform: translateY(100vh) translateX(0); }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(-10vh) translateX(40px); }
  }

  /* Noise overlay */
  .noise {
    position: fixed;
    inset: 0;
    z-index: 2;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 200px;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="bg-layer">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="grid"></div>
<div class="noise"></div>

<!-- Particles -->
<div class="particle" style="left:10%; animation-duration:18s; animation-delay:0s;"></div>
<div class="particle" style="left:25%; animation-duration:22s; animation-delay:-5s; background:#c45c3a;"></div>
<div class="particle" style="left:50%; animation-duration:16s; animation-delay:-10s;"></div>
<div class="particle" style="left:70%; animation-duration:20s; animation-delay:-3s; background:#6b8c6e;"></div>
<div class="particle" style="left:85%; animation-duration:14s; animation-delay:-7s;"></div>

<div class="card-wrap">
  <div class="card">

    <div class="logo-wrap">
      <div class="logo-icon">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="18,2 34,10 34,26 18,34 2,26 2,10" stroke="#c9a84c" stroke-width="1.2" fill="none"/>
          <polygon points="18,8 28,13 28,23 18,28 8,23 8,13" stroke="#c9a84c" stroke-width="0.8" fill="rgba(201,168,76,0.08)"/>
          <circle cx="18" cy="18" r="3" fill="#c9a84c"/>
        </svg>
      </div>
      <div class="logo-text">New Age Homes</div>
    </div>

    <div class="heading">Welcome <span>back.</span></div>
    <div class="subtext">Sign in to continue your session</div>

    <div class="divider"></div>

    <div class="field">
      <label for="email">Email address</label>
      <div class="input-wrap">
        <input type="email" id="email" placeholder="your@email.com" autocomplete="off">
        <div class="input-line"></div>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="••••••••••">
        <div class="input-line"></div>
      </div>
    </div>

    <div class="options">
      <label class="remember">
        <input type="checkbox"> <span>Remember me</span>
      </label>
      <a href="#" class="forgot">Forgot password?</a>
    </div>

    <button class="btn" onclick="handleLogin(this)">
      <span class="btn-text">Sign In</span>
    </button>

    <div class="or-row">
      <div class="or-line"></div>
      <div class="or-text">or</div>
      <div class="or-line"></div>
    </div>

    <div class="socials">
      <button class="social-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google
      </button>
      <button class="social-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="color:#b8c4c2">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        GitHub
      </button>
    </div>

    <div class="footer">
      Don't have an account? <a href="#">Create one</a>
      <br><br>
      <button class="btn" style="width:auto;padding:10px 24px;margin-top:10px;" onclick="bookVisit()">Book a Visit</button>
    </div>

  </div>
</div>

<script>
function handleLogin(btn) {
  const email = document.getElementById('email').value;
  const pass = document.getElementById('password').value;
  const span = btn.querySelector('.btn-text');

  if (!email || !pass) {
    btn.style.background = '#c45c3a';
    btn.style.boxShadow = '0 8px 32px rgba(196,92,58,0.35)';
    span.textContent = 'Fill in all fields';
    setTimeout(() => {
      btn.style.background = '';
      btn.style.boxShadow = '';
      span.textContent = 'Sign In';
    }, 2000);
    return;
  }

  span.textContent = '...';
  btn.style.opacity = '0.7';
  btn.disabled = true;

  setTimeout(() => {
    btn.style.background = '#6b8c6e';
    btn.style.boxShadow = '0 8px 32px rgba(107,140,110,0.35)';
    btn.style.opacity = '1';
    span.textContent = '✓ Authenticated';

    setTimeout(() => {
      btn.disabled = false;
      btn.style.background = '';
      btn.style.boxShadow = '';
      span.textContent = 'Sign In';
    }, 2500);
  }, 1600);
    // Redirect to home_page.html after authentication
    setTimeout(() => {
      window.location.href = 'home_page.html';
    }, 1200);
}
// Book a Visit button handler
function bookVisit() {
  window.location.href = 'book.html';
}
</script>

</body>
</html>
